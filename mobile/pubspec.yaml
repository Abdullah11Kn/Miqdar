name: miqdar_mobile
description: Miqdar smart nutrition scale companion app.
publish_to: "none"
version: 1.1.0+2

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  image_picker: ^1.1.2
  intl: ^0.20.1
  path: ^1.9.0
  sqflite: ^2.4.1
  file_picker: ^13.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/miqdar-logo.png
    - assets/branding/miqdar-food.png
    - assets/demo/kabsa.jpg
    - assets/demo/shawarma.jpeg
    - assets/demo/jareesh.jpeg
    - assets/demo/pizza.jpeg
    - assets/demo/burger.jpg
