name: miqdar_mobile
description: Miqdar smart nutrition scale companion app.
publish_to: "none"
version: 1.1.0+2

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  image_picker: ^1.1.2
  intl: ^0.20.1
  path: ^1.9.0
  sqflite: ^2.4.1
  file_picker: ^13.2.0
  speech_to_text: ^7.5.0
  flutter_local_notifications: ^22.3.3
  timezone: ^0.11.2
  flutter_timezone: ^5.1.1
  hijri: ^3.0.1
  printing: ^5.15.1
  pdf: ^3.13.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  sqflite_common_ffi: ^2.4.5

flutter:
  uses-material-design: true
  assets:
    - assets/branding/miqdar-logo.png
    - assets/branding/miqdar-food.png
    - assets/demo/kabsa.jpg
    - assets/demo/shawarma.jpeg
    - assets/demo/jareesh.jpeg
    - assets/demo/pizza.jpeg
    - assets/demo/burger.jpg
    # Welcome photo wall. Sources and licences: assets/welcome/CREDITS.md
    - assets/welcome/falafel-pita.jpg
    - assets/welcome/fattoush-bowl.jpg
    - assets/welcome/fattoush-plate.jpg
    - assets/welcome/grilled-chicken.jpg
    - assets/welcome/harees.jpg
    - assets/welcome/hummus-falafel.jpg
    - assets/welcome/hummus.jpg
    - assets/welcome/kabsa-eggs.jpg
    - assets/welcome/kabsa-raisins.jpg
    - assets/welcome/mandi-plate.jpg
    - assets/welcome/mandi-pot.jpg
    - assets/welcome/mezze-plate.jpg
  fonts:
    - family: MiqdarSymbols
      fonts:
        - asset: assets/fonts/MiqdarSymbols.ttf
    # Not in git, by licence. Run assets/fonts/install_thmanyah.sh once on each Mac.
    - family: Thmanyah Sans
      fonts:
        - asset: assets/fonts/thmanyah/thmanyah-sans-Regular.otf
          weight: 400
        - asset: assets/fonts/thmanyah/thmanyah-sans-Medium.otf
          weight: 500
        - asset: assets/fonts/thmanyah/thmanyah-sans-Bold.otf
          weight: 700
    - family: Thmanyah Serif Display
      fonts:
        - asset: assets/fonts/thmanyah/thmanyah-serif-display-Bold.otf
          weight: 700
    - family: Thmanyah Serif Text
      fonts:
        - asset: assets/fonts/thmanyah/thmanyah-serif-text-Regular.otf
          weight: 400
        - asset: assets/fonts/thmanyah/thmanyah-serif-text-Bold.otf
          weight: 700
