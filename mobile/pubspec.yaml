name: miqdar_mobile
description: Miqdar smart nutrition scale companion app.
publish_to: "none"
version: 1.1.0+2

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  image_picker: ^1.1.2
  intl: ^0.20.1
  path: ^1.9.0
  sqflite: ^2.4.1
  file_picker: ^13.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/miqdar-logo.png
    - assets/demo/kabsa.jpg
    - assets/demo/shawarma.jpeg
    - assets/demo/jareesh.jpeg
    - assets/demo/pizza.jpeg
    - assets/demo/burger.jpg

  fonts:
    # UI text, Arabic and Latin
    - family: Plex
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansArabic-Bold.ttf
          weight: 700
    # Display: numbers, names and titles. Arabic falls back to Amiri.
    - family: MiqdarSerif
      fonts:
        - asset: assets/fonts/InstrumentSerif-Regular.ttf
        - asset: assets/fonts/InstrumentSerif-Italic.ttf
          style: italic
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf
    - family: PhosphorLight
      fonts:
        - asset: assets/fonts/Phosphor-Light.ttf
    - family: PhosphorFill
      fonts:
        - asset: assets/fonts/Phosphor-Fill.ttf
